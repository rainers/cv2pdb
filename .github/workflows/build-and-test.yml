name: build and test cv2pdb

on: [push, pull_request]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: src/cv2pdb.vcxproj

  # Configuration type to build.
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM_TOOLSET: v143

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        BUILD_PLATFORM: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build cv2pdb
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild /m /p:PlatformToolset=${{env.BUILD_PLATFORM_TOOLSET}} /p:Platform=${{matrix.BUILD_PLATFORM}} /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
      - name: Build dumplines
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild /m /p:PlatformToolset=${{env.BUILD_PLATFORM_TOOLSET}} /p:Platform=Win32 /p:Configuration=${{env.BUILD_CONFIGURATION}} src/dumplines.vcxproj
      - name: Upload bin/
        if: matrix.BUILD_PLATFORM == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin
  test-with-g4w-sdk:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - uses: git-for-windows/setup-git-for-windows-sdk@v1
      - name: verify using Git for Windows' GCC
        shell: bash
        run: |
          set -x &&
          cat >hello.c <<-\EOF &&
          #include <stdio.h>

          int main(int argc, char **argv)
          {
            printf("Hello, world\n");
            return 0;
          }
          EOF

          gcc -g -o hello.exe hello.c &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe hello.exe world.exe &&

          ls -l hello* world* &&

          curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe &&
          ./cvdump.exe world.pdb >world.cvdump &&
          grep '^S_PUB32: .*, Flags: 00000000, main$' world.cvdump
      - name: verify split functions
        shell: bash
        run: |
          set -x &&
          cat >split.c <<-\EOF &&
          __attribute__((cold,noinline)) void cold() { volatile int i=0; }
          __attribute__((dllexport)) void split_func(int i)
          {
            if (i)
              cold();
          }
          EOF

          gcc -g -O2 -shared -o split-dwarf.dll split.c &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe split-dwarf.dll split-cv.dll &&

          ls -l split-dwarf* split-cv* &&

          curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe &&
          ./cvdump.exe split-cv.pdb > split-cv.dump &&
          awk '$2 == "S_GPROC32:" && $NF == "split_func" { scope=gensub(/,/,"",1,$3); } $2 == "S_SEPCODE:" { getline; if ($4 == scope) found=1; } END {exit !found; }' split-cv.dump
  test-dwarf5:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: download cvdump
        shell: bash
        run: curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe
      - name: build and convert DWARF 5 Go program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >main.go <<-\EOF &&
          package main

          import "os"

          //go:noinline
          func Square(x int) int { return x * x }

          func Twice(x int) int { return x + x }

          type Value int

          //go:noinline
          func (v Value) Get() int { return int(v) + 1 }

          type Getter interface{ Get() int }

          var sink func(int) int

          //go:noinline
          func call(g Getter) int { return g.Get() }

          func main() {
            sink = Twice
            os.Exit(Square(len(os.Args)) + Twice(len(os.Args)) + sink(1) + call(new(Value)) - 100)
          }
          EOF

          go version &&
          CGO_ENABLED=0 go build -ldflags=-compressdwarf=false -o go-dwarf.exe main.go &&
          go tool nm go-dwarf.exe >go-dwarf.nm &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe go-dwarf.exe go-cv.exe &&
          ./cvdump.exe -s -l go-cv.pdb >go-cv.dump
      - name: verify function addresses (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          text=$(awk '$3 == "runtime.text" { print $1 }' go-dwarf.nm) &&
          for f in main.call main.main 'main.(*Value).Get'; do
            addr=$(awk -v n="$f" '$2 == "T" && $3 == n { print $1 }' go-dwarf.nm) &&
            off=$(printf '%08X' $((0x$addr - 0x$text))) &&
            awk -v a="[0001:$off]," -v n=", ${f//./@}" '$2 == "S_GPROC32:" && $3 == a && substr($0, length($0) - length(n) + 1) == n { found=1 } END {exit !found; }' go-cv.dump || exit 1
          done
      - name: verify names of inlined functions (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          grep 'S_GPROC32: .*, main@Twice$' go-cv.dump &&
          ! grep 'S_GPROC32: .*\[anon_' go-cv.dump
      - name: verify source file of generated code (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          grep -m1 '^  \.\\<autogenerated> (' go-cv.dump &&
          ! grep '^  \.\\? (' go-cv.dump
      - name: verify variables with an empty location are left out (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          mkdir -p emptyloc &&
          cat >emptyloc/main.go <<-\EOF &&
          package main

          import (
            "debug/dwarf"
            "debug/pe"
            "fmt"
            "os"
            "strings"
          )

          func main() {
            f, err := pe.Open(os.Args[1])
            if err != nil {
              panic(err)
            }
            d, err := f.DWARF()
            if err != nil {
              panic(err)
            }
            r := d.Reader()
            fn := ""
            for {
              e, err := r.Next()
              if err != nil {
                panic(err)
              }
              if e == nil {
                break
              }
              name, _ := e.Val(dwarf.AttrName).(string)
              switch e.Tag {
              case dwarf.TagSubprogram:
                fn = name
              case dwarf.TagFormalParameter, dwarf.TagVariable:
                loc := e.AttrField(dwarf.AttrLocation)
                if strings.HasPrefix(fn, "main.") && loc != nil && loc.Class == dwarf.ClassExprLoc && len(loc.Val.([]byte)) == 0 {
                  fmt.Println(strings.ReplaceAll(fn, ".", "@"), name)
                }
              }
            }
          }
          EOF

          go run emptyloc/main.go go-dwarf.exe >emptyloc.txt &&
          { test -s emptyloc.txt || { echo "test precondition lost: no variable with an empty location"; exit 1; }; } &&
          awk 'NR == FNR { want[$1 " " $2] = 1; next }
               $2 == "S_GPROC32:" { proc = $NF }
               $2 == "S_REGREL32:" && (proc " " $NF) in want { print; bad++ }
               END { exit bad > 0 }' emptyloc.txt go-cv.dump
      - name: build DWARF 5 clang program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >block.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          __attribute__((noinline)) int get(int i) { return rand() + i; }

          int main(int argc, char **argv)
          {
            int sum = 0;
            for (int i = 0; i < argc; i++) {
              int v = get(i);
              if (v & 1) {
                int w = get(v);
                sum += w * v;
              } else
                sum -= v;
            }
            printf("%d\n", sum);
            return 0;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-5 -O2 -o block.exe block.c &&
          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-5 -O2 -ffunction-sections -o sections.exe block.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-5 -O2 -c -o block.o block.c &&
          llvm-objdump -h block.o >block-o.sections &&
          { grep ' \.debug_rnglists ' block-o.sections || { echo "test precondition lost: no lexical block with ranges"; exit 1; }; } &&
          llvm-objdump -h block.exe >block.sections &&
          llvm-nm block.exe >block.nm
      - name: convert line tables with MD5 checksums (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe block.exe block-cv.exe 2>&1 | tee block-cv.log &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe sections.exe sections-cv.exe 2>&1 | tee sections-cv.log &&
          ./cvdump.exe -s -l block-cv.pdb >block-cv.dump
      - name: verify conversion reports no errors (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          test -f block-cv.log && test -f sections-cv.log &&
          ! grep ERROR: block-cv.log sections-cv.log
      - name: verify function addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          text=$(awk '$2 == ".text" { print $4 }' block.sections) &&
          for f in get main; do
            addr=$(awk -v n=$f '$2 == "T" && $3 == n { print $1 }' block.nm) &&
            off=$(printf '%08X' $((0x$addr - 0x$text))) &&
            grep "S_GPROC32: \[0001:$off\], .*, $f\$" block-cv.dump || exit 1
          done
      - name: verify lexical block addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          awk '$2 == "S_GPROC32:" { split($3, a, /[:\]]/); lo = strtonum("0x" a[2]); hi = lo + strtonum("0x" substr($5, 1, 8)); inmain = $NF == "main"; }
               $2 == "S_BLOCK32:" && inmain { split($3, a, /[:\]]/); o = strtonum("0x" a[2]); n++; if (o < lo || o >= hi) { print; bad++; } }
               END {exit !(n && !bad); }' block-cv.dump
      - name: build and convert DWARF 5 clang program with globals
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >global.c <<-\EOF &&
          int g_counter = 1;
          static int s_counter = 2;

          int main(int argc, char **argv)
          {
            s_counter += argc;
            return g_counter + s_counter;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-5 -O0 -Wl,--image-base=0x10000000 -o global.exe global.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-5 -O0 -S -o global.s global.c &&
          { awk '/# DW_AT_location$/ { getline; if ($2 == 161) n++ } END { exit !n }' global.s || { echo "test precondition lost: no DW_OP_addrx location"; exit 1; }; } &&
          llvm-objdump -p global.exe >global.headers &&
          { grep -E '^ImageBase\s+0*10000000$' global.headers || { echo "test precondition lost: image base is not 0x10000000"; exit 1; }; } &&
          llvm-objdump -h global.exe >global.sections &&
          llvm-nm global.exe >global.nm &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe global.exe global-cv.exe &&
          ./cvdump.exe -g global-cv.pdb >global-cv.dump
      - name: verify global variable addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          seg=$(awk '$2 == ".data" { printf "%04X", $1 + 1 }' global.sections) &&
          data=$(awk '$2 == ".data" { print $4 }' global.sections) &&
          for v in g_counter s_counter; do
            addr=$(awk -v n=$v '$3 == n { print $1 }' global.nm) &&
            off=$(printf '%08X' $((0x$addr - 0x$data))) &&
            grep "S_GDATA32: \[$seg:$off\], .*, $v\$" global-cv.dump || exit 1
          done
  test-64-bit-addresses:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - name: download cvdump
        shell: bash
        run: curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe
      - name: build and convert DWARF 4 clang program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >block.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          int g_counter = 3;
          static int s_total;

          __attribute__((noinline)) int get(int i) { return rand() + i; }
          __attribute__((noinline)) void use(int *p) { *p += g_counter; }

          int main(int argc, char **argv)
          {
            for (int i = 0; i < argc; i++) {
              int v = get(i);
              use(&v);
              if (v & 1) {
                int w = get(v);
                use(&w);
                s_total += w * v;
              } else
                s_total -= v;
            }
            printf("%d\n", s_total);
            return 0;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-4 -O2 -ffunction-sections -o block.exe block.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-4 -O2 -ffunction-sections -S -o block.s block.c &&
          { awk '/DW_TAG_lexical_block$/ { getline; if ($NF == "DW_AT_ranges") r = $2 ":" } r && $1 == r { getline; if ($1 == ".quad" && $2 !~ /-/) found = 1 } END { exit !found }' block.s || { echo "test precondition lost: no lexical block with absolute ranges"; exit 1; }; } &&
          llvm-objdump -p block.exe >block.headers &&
          { awk '$1 == "ImageBase" { found = strtonum("0x" $2) >= 2^32 } END { exit !found }' block.headers || { echo "test precondition lost: image base below 4 GB"; exit 1; }; } &&
          llvm-objdump -h block.exe >block.sections &&
          llvm-nm block.exe >block.nm &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe block.exe block-cv.exe &&
          ./cvdump.exe -s block-cv.pdb >block-cv.dump &&
          ./cvdump.exe -g block-cv.pdb >block-cv.globals
      - name: verify global variable addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in g_counter s_total; do
            addr=$(awk -v n=$v '$3 == n { print $1 }' block.nm) &&
            test -n "$addr" &&
            loc=$(awk -v a=$((0x$addr)) '$1 ~ /^[0-9]+$/ { lo = strtonum("0x" $4); if (lo <= a && a < lo + strtonum("0x" $3)) printf "[%04X:%08X],", $1 + 1, a - lo }' block.sections) &&
            awk -v a="$loc" -v n=", $v" '($1 == "S_GDATA32:" || $1 == "S_LDATA32:") && $2 == a && substr($0, length($0) - length(n) + 1) == n { found=1 } END {exit !found; }' block-cv.globals || exit 1
          done
      - name: verify locals of lexical blocks with ranges (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          awk '$2 == "S_GPROC32:" { inmain = $NF == "main"; depth = 0 }
               inmain && $2 == "S_BLOCK32:" { depth++ }
               inmain && $2 == "S_END" { depth-- }
               inmain && depth > 0 && $2 == "S_REGREL32:" { found[$NF] = 1 }
               END {exit !(found["v"] && found["w"]); }' block-cv.dump
      - name: verify parameters described by DWARF 4 location lists (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >spill.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          #define CLOBBER __asm__ volatile("" ::: "rax", "rbx", "rcx", "rdx", "rsi", "rdi", "r8", "r9", "r10", "r11", "r12", "r13", "r14", "r15", "memory")

          __attribute__((noinline)) int get(int i) { return rand() + i; }

          __attribute__((noinline)) int spill(int a, int b)
          {
            int s = get(a);
            CLOBBER;
            s += get(b);
            CLOBBER;
            s += get(s);
            CLOBBER;
            return s * a + b;
          }

          int main(int argc, char **argv)
          {
            printf("%d\n", spill(argc, argc + 1));
            return 0;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-4 -O2 -ffunction-sections -o spill.exe spill.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-4 -O2 -ffunction-sections -S -o spill.s spill.c &&
          { awk 'FNR == NR && $1 ~ /^\.Linfo_string[0-9]+:$/ { s = substr($1, 1, length($1) - 1); getline; str[s] = $2; next }
                 FNR == NR && $1 == ".section" { inloc = $2 ~ /^\.debug_loc,/; next }
                 FNR == NR && inloc && $1 ~ /^\.Ldebug_loc[0-9]+:$/ { l = substr($1, 1, length($1) - 1); getline; base[l] = $1 == ".quad" && $2 == "-1"; next }
                 FNR == NR && inloc && $NF == "DW_OP_breg7" { getline; slots[l] = slots[l] " " $NF; next }
                 FNR == NR { next }
                 /Abbrev \[/ { tag = $NF; if (tag == "DW_TAG_subprogram") insub = 0 }
                 tag == "DW_TAG_subprogram" && $NF == "DW_AT_name" { insub = str[$2] == "\"spill\"" }
                 insub && tag == "DW_TAG_formal_parameter" && $NF == "DW_AT_location" { l = $2 }
                 insub && tag == "DW_TAG_formal_parameter" && $NF == "DW_AT_name" { if (!base[l] || slots[l] == "") bad = 1; name = str[$2]; gsub(/"/, "", name); print name slots[l]; n++; l = "" }
                 END { exit bad || n != 2 }' spill.s spill.s >spill.expected ||
            { echo "test precondition lost: spill should have two parameters, each with a location list that starts with a base address entry and includes a stack slot"; exit 1; }; } &&
          cat spill.expected &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe spill.exe spill-cv.exe &&
          ./cvdump.exe -s spill-cv.pdb >spill-cv.dump &&
          awk 'FNR == NR { want[$1] = $0 " "; next }
               $2 == "S_GPROC32:" { inspill = $NF == "spill" }
               inspill && $2 == "S_REGREL32:" && ($NF in want) { got[$NF]++; split($3, r, "+"); if (r[1] != "rsp" || !index(want[$NF], " " strtonum("0x" substr(r[2], 1, 8)) " ")) bad = 1 }
               END { for (p in want) if (got[p] != 1) bad = 1; exit bad }' spill.expected spill-cv.dump
      - name: verify procedures at the 4 GB boundary (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >edge.c <<-\EOF &&
          __attribute__((noinline)) int edge(int a) { return a * 7 + 1; }

          int main(int argc, char **argv) { return edge(argc); }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -O1 -o edge-probe.exe edge.c &&
          base=$(llvm-objdump -p edge-probe.exe | awk '$1 == "ImageBase" { print $2 }') &&
          main=$(llvm-nm edge-probe.exe | awk '$3 == "main" { print $1 }') &&
          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -O1 -Wl,--image-base=$(printf '0x%x' $(((1 << 32) - (0x$main - 0x$base)))) -o edge.exe edge.c &&
          llvm-objdump -h edge.exe >edge.sections &&
          llvm-nm edge.exe >edge.nm &&
          { awk '$3 == "main" { found = strtonum("0x" $1) == 2^32 } END { exit !found }' edge.nm || { echo "test precondition lost: main does not start at 4 GB"; exit 1; }; } &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe edge.exe edge-cv.exe &&
          ./cvdump.exe -s edge-cv.pdb >edge-cv.dump &&
          text=$(awk '$2 == ".text" { print $4 }' edge.sections) &&
          addr=$(awk '$2 == "T" && $3 == "main" { print $1 }' edge.nm) &&
          off=$(printf '%08X' $((0x$addr - 0x$text))) &&
          grep "S_GPROC32: \[0001:$off\], .*, main\$" edge-cv.dump
